{% extends "base.html" %}
{% block content %}
<div class="card">
    <h1>Welcome to Task Manager 👋</h1>
    <p style="margin: 15px 0; color: #555; font-size: 16px;">
        A simple app to manage your tasks. Add, update, and delete tasks easily.
    </p>
    <a href="/tasks" class="btn btn-primary">View All Tasks →</a>
</div>
<div style="display: flex; gap: 20px;">
    <div class="card" style="flex:1; text-align:center;">
        <h2 style="font-size:40px; color:#1F4E79;">{{ total }}</h2>
        <p style="color:#555;">Total Tasks</p>
    </div>
    <div class="card" style="flex:1; text-align:center;">
        <h2 style="font-size:40px; color:#27ae60;">{{ done }}</h2>
        <p style="color:#555;">Completed</p>
    </div>
    <div class="card" style="flex:1; text-align:center;">
        <h2 style="font-size:40px; color:#e74c3c;">{{ pending }}</h2>
        <p style="color:#555;">Pending</p>
    </div>
</div>
{% endblock %}
